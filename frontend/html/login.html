<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#131313"><title>Sign in — GapLens AI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Roboto+Flex:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#131313;color:#e5e2e1;font-family:'Roboto Flex',sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);border:1px solid #43474f;background:#1c1b1b;border-radius:14px;padding:32px;box-shadow:0 20px 70px #0006}.brand{font:600 18px 'Plus Jakarta Sans';color:#e5e2e1;text-decoration:none}.eyebrow{font:11px 'Space Mono';letter-spacing:.08em;color:#a8c7fa;margin-top:5px}.card h1{font:600 28px 'Plus Jakarta Sans';margin:28px 0 8px}.card>p{color:#c3c6d0;font-size:14px;line-height:1.6;margin:0 0 24px}label{display:block;font-size:13px;margin:16px 0 7px}input{width:100%;border:1px solid #43474f;background:#131313;border-radius:6px;padding:12px;color:#e5e2e1;font:14px 'Roboto Flex'}input:focus{outline:2px solid #a8c7fa;outline-offset:1px}.button{margin-top:22px;width:100%;border:0;border-radius:6px;background:#a8c7fa;color:#001c3b;padding:13px;font-weight:600;font-size:14px;cursor:pointer}.button:disabled{opacity:.6;cursor:wait}.error{min-height:20px;color:#ffb4ab;font-size:13px;margin-top:12px}.switch{border-top:1px solid #43474f;margin-top:20px;padding-top:18px;text-align:center;font-size:13px;color:#c3c6d0}.switch button{background:none;border:0;color:#a8c7fa;text-decoration:underline;cursor:pointer;font:inherit}.back{display:block;margin-top:18px;text-align:center;text-decoration:none;color:#aeb2bc;font-size:13px}</style></head><body><main class="card"><a class="brand" href="/">GapLens AI</a><div class="eyebrow">PRIVATE RESEARCH WORKSPACE</div><h1 id="title">Sign in</h1><p id="description">Sign in to open your research sessions and keep your work together.</p><form id="form"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="320" placeholder="you@example.com"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required maxlength="256" placeholder="At least 8 characters"><button class="button" id="submit" type="submit">Sign in</button></form><div class="error" id="error" role="alert" aria-live="polite"></div><div class="switch"><span id="switch-copy">New to GapLens?</span> <button id="switch" type="button">Create an account</button></div><a class="back" href="/">Back to GapLens home</a></main><script src="/auth.js" defer></script></body></html>
